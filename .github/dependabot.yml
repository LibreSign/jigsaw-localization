version: 2

updates:
  - package-ecosystem: composer
    directories:
      - /
      - /vendor-bin/phpunit
      - /vendor-bin/phpstan
      - /vendor-bin/phpmd
      - /vendor-bin/pint
    schedule:
      interval: weekly
    groups:
      composer-development-dependencies:
        dependency-type: development
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
